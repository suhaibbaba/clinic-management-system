name: Release

# Every merge to main is a release.
#
# The version goes up by one minor, `scripts/release.mjs` writes it everywhere
# it is repeated, and the commit that carries it is tagged `vX.Y.Z`. That tag
# is what the sandbox deploys — see deploy-sandbox.yml — so the running build
# always reports its own version rather than the one before it.
#
# The exception the script makes is the useful one: a version in package.json
# that has no tag yet is released as written. That is how this bootstraps at
# v1.0.0, and how a major is cut — set it in the pull request and the merge
# releases exactly that.
on:
  push:
    branches: [main]

# Releases are sequential by definition, and two of them at once would race for
# the same tag. Never cancelled: a half-made release is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest

    # Its own bump commit lands on main and would otherwise start this again,
    # one release per release, forever.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    permissions:
      contents: write

    steps:
      # Full history and tags: the script asks whether the current version is
      # already tagged, and the notes are the commits since the last one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Work out the version
        id: version
        run: node scripts/release.mjs

      # Belt and braces: the bump is a mechanical edit, but it edits four
      # manifests and a TypeScript constant, and a release that ships them out
      # of step is exactly what `version:check` exists to catch.
      - name: Check the version is consistent
        run: pnpm version:check

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMPED: ${{ steps.version.outputs.bumped }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Nothing to commit on the bootstrap release: the manifest already
          # says what is being released, so it is tagged where it stands. An
          # empty commit would be a lie about a change that did not happen.
          if [ "$BUMPED" = 'true' ]; then
            git commit -am "chore(release): v${VERSION}"
            git push origin HEAD:main
          fi

          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      # The notes are the merges since the last release — which, with one
      # release per merge, is usually the one pull request this release is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          previous=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)

          if [ -n "$previous" ]; then
            range="${previous}..v${VERSION}"
            heading="Changes since ${previous}"
          else
            range="v${VERSION}"
            heading='Changes'
          fi

          # `-n 50` rather than `| head -50`: under `pipefail`, head closing the
          # pipe early kills git with SIGPIPE and the step exits 141 — which is
          # exactly what the first release, with the whole history in range,
          # would have done.
          {
            echo "## ${heading}"
            echo
            git log --no-merges -n 50 --pretty=format:'- %s' \
              --invert-grep --grep='^chore(release):' "$range"
          } > notes.md

          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md
