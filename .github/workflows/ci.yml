name: CI

# Reusable, and called rather than triggered: every deploy runs these same
# checks, so a second environment adds a caller instead of a second copy.
on:
  workflow_call:
  # Every pull request, so the API suites — the assistant's outbound and
  # authorization paths among them — run against Postgres before anything merges.
  # Only the deploy stays on main.
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the older run moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No `needs` anywhere: the runners are free on a public repo and the only thing
# a chain buys is a later answer. The deploy waits on the whole workflow, so the
# gate is unchanged — a red check still never reaches the VPS.
#
# The suites are sharded because they are CPU-bound and a runner has about four
# cores: the web suite alone spends 100s of CPU, which is 9s on a laptop and 76s
# here. Split across runners it is the length of one shard.
#
# Only two things need a build: the API, which consumes packages/shared as built
# declarations, and the bundle-size check, which reads dist/. Everything else
# resolves the workspace from source through the Vite aliases.
#
# The static checks — lint, typecheck, formatting, dead code, colour literals,
# i18n — are deliberately not here. They are still `pnpm lint`, `pnpm typecheck`
# and the rest, run locally; CI gates on tests and images only.
jobs:
  test-api:
    name: API tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest

    # One database per shard, so a fresh schema rather than the shared one the
    # suite runs against locally. Specs build their own clinic, so they do not
    # read each other's rows.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Real Postgres: clinic scoping, audit writes and auth are end to end, not mocked.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_test_password
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://clinic:clinic_test_password@localhost:5432/clinic_test
      JWT_SECRET: ci-only-jwt-secret-value-at-least-32-characters
      # Presigning is offline: a configured client, no bucket to reach.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: clinic-test-files
      STORAGE_ACCESS_KEY_ID: ci_access_key
      STORAGE_SECRET_ACCESS_KEY: ci_secret_key
      STORAGE_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workspace

      - name: Build the API and what it depends on
        run: pnpm --filter @clinic/api... build

      # Still one worker inside a shard: the schema is shared within it.
      - name: Test
        run: pnpm --filter @clinic/api exec jest --shard=${{ matrix.shard }}/2

  test-web:
    name: Web tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workspace

      - name: Test
        run: >-
          pnpm --filter @clinic/web exec vitest run
          --project app --shard=${{ matrix.shard }}/3

  test-browser:
    name: Browser, interface and proxy tests
    runs-on: ubuntu-latest

    # The three small lanes together, because each is seconds and a runner costs
    # half a minute to reach the first one.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workspace

      - name: Test the interface system
        run: pnpm --filter @clinic/ui test

      - name: Test the dev proxy
        run: pnpm --filter @clinic/web exec vitest run --project dev-proxy

      # Browser mode drives a real Chromium: the type scale, control heights and
      # anything measured rather than asserted about run there.
      - name: Install the browser the component tests drive
        run: pnpm --filter @clinic/web exec playwright install --with-deps chromium

      # Its own step, not part of `pnpm test`: a browser session will not attach
      # while the jsdom project is running beside it.
      - name: Test in a real browser
        run: pnpm --filter @clinic/web test:browser

  bundle:
    name: Booking bundle size
    runs-on: ubuntu-latest

    # Opened from a WhatsApp link on mobile data; it gets heavy one stray
    # dashboard import at a time. The only web job that needs a build.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workspace

      - name: Build the web app and what it depends on
        run: pnpm --filter '@clinic/web...' build

      - name: Check the booking bundle size
        run: pnpm --filter @clinic/web size:booking

  image-api:
    name: API image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_test_password
          POSTGRES_DB: clinic_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: clinic-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Running it, not just building it: argon2's musl binding either loads on
      # Alpine or it does not, and a build never finds out.
      - name: Smoke-test the API image
        run: |
          set -euo pipefail
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL=postgres://clinic:clinic_test_password@localhost:5432/clinic_smoke \
            -e JWT_SECRET=ci-only-jwt-secret-value-at-least-32-characters \
            -e STORAGE_ENDPOINT=http://localhost:9000 \
            -e STORAGE_BUCKET=clinic-smoke-files \
            -e STORAGE_ACCESS_KEY_ID=ci_access_key \
            -e STORAGE_SECRET_ACCESS_KEY=ci_secret_key \
            -e STORAGE_FORCE_PATH_STYLE=true \
            clinic-api:ci sh -c "node dist/database/migrate.js && node dist/main.js"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- /health ---"
          curl -fsS http://localhost:3000/health | tee /tmp/health.json
          grep -q '"database":"up"' /tmp/health.json

          # 401 not 500: argon2 hashed the decoy rather than failing to load.
          echo "--- login rejects unknown credentials ---"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/login \
            -H 'content-type: application/json' \
            -d '{"identifier":"nobody@example.com","password":"whatever123"}')
          echo "login status: $status"
          test "$status" = "401"

      - name: API container logs
        if: always()
        run: docker logs api-smoke || true

  image-web:
    name: Web image and compose files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          # Deployed verbatim, so a typo here would only surface on the server.
          docker compose -f docker-compose.sandbox.yml config --quiet

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: clinic-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
