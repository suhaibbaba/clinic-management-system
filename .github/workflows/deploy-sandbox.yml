name: Deploy sandbox

# push to main -> build & push images to GHCR -> deploy over SSH -> healthcheck.
#
# The VPS is shared with other projects, so this workflow only ever touches
# /opt/clinic/sandbox and the `clinic-sandbox` compose project. It installs no
# reverse proxy and no TLS: the host-level nginx already fronts the machine and
# reaches this stack over 127.0.0.1.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys reach the server at once, and never cancel one
# mid-flight — a half-applied migration is worse than a queued deploy.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  API_IMAGE: clinic-api
  WEB_IMAGE: clinic-web
  SANDBOX_URL: https://clinic-sandbox.organza-moda.com
  REMOTE_DIR: /opt/clinic/sandbox
  COMPOSE_PROJECT: clinic-sandbox

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase; a repository owner need not be.
      - name: Resolve registry namespace
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build from the repository root as a single context, so the
      # pnpm workspace (and packages/shared) is never duplicated per app.
      #
      # Two tags each: the commit SHA, which is what a rollback pins to, and
      # `sandbox`, which is what the server pulls.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.API_IMAGE }}:sandbox
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.WEB_IMAGE }}:sandbox
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to sandbox VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare the deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            mkdir -p ${{ env.REMOTE_DIR }}

      # The compose file is the only thing this repository puts on the server.
      # Everything secret lives in /opt/clinic/sandbox/.env, which is created
      # once by hand and never touched by CI (see DEPLOY.md).
      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          source: docker-compose.sandbox.yml
          target: ${{ env.REMOTE_DIR }}
          overwrite: true

      - name: Pull and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd ${{ env.REMOTE_DIR }}

            # Fail loudly rather than booting a stack with empty passwords.
            test -f .env || { echo "missing ${{ env.REMOTE_DIR }}/.env — see DEPLOY.md"; exit 1; }

            docker compose -p ${{ env.COMPOSE_PROJECT }} pull
            docker compose -p ${{ env.COMPOSE_PROJECT }} up -d --remove-orphans

            docker compose -p ${{ env.COMPOSE_PROJECT }} ps

            # Only dangling layers, and only ours by virtue of being dangling —
            # other projects on this machine keep their tagged images.
            docker image prune -f

      # From the runner, over the public hostname: this proves the whole path
      # works — host nginx, TLS, the web container's /api proxy and the API's
      # database connection — not just that a container started.
      - name: Healthcheck through the public hostname
        run: |
          set -euo pipefail
          url="${{ env.SANDBOX_URL }}/api/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$url" 2>/dev/null) || body=""

            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              printf '%s\n' "$body"

              # A reachable API with an unreachable database is not a deploy
              # anyone should call successful.
              if ! printf '%s' "$body" | grep -q '"database":"up"'; then
                echo "::error::API is up but reports the database down"
                exit 1
              fi

              exit 0
            fi

            echo "attempt ${attempt}: not healthy yet"
            sleep 5
          done

          echo "::error::${url} did not report healthy after 30 attempts, 5s apart"
          echo "last response: ${body:-<no response>}"
          exit 1
