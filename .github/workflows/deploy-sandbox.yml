name: Deploy sandbox

# push to main -> build on the server -> healthcheck.
#
# There is no registry in this pipeline. The VPS holds the repository at
# /opt/clinic/sandbox, so a deploy is: fast-forward that checkout to origin/main
# and rebuild the two images in place. The runner never builds an image and
# never pushes one anywhere.
#
# The VPS is shared with other projects, so this workflow only ever touches
# /opt/clinic/sandbox and the `clinic-sandbox` compose project. It installs no
# reverse proxy and no TLS: the host-level nginx already fronts the machine and
# reaches this stack over 127.0.0.1.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys reach the server at once, and never cancel one
# mid-flight — a half-applied migration is worse than a queued deploy.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  SANDBOX_URL: https://clinic-sandbox.organza-moda.com
  REMOTE_DIR: /opt/clinic/sandbox
  COMPOSE_PROJECT: clinic-sandbox

jobs:
  deploy:
    name: Deploy to sandbox VPS
    runs-on: ubuntu-latest

    steps:
      # Everything happens on the server: it already has the sources, and the
      # secrets that configure them live in /opt/clinic/sandbox/.env, which is
      # created once by hand and never touched by CI (see DEPLOY.md).
      - name: Build and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          script_stop: true
          # A build on a shared VPS is slower than a registry pull, and the
          # first one has no layer cache at all.
          command_timeout: 30m
          script: |
            set -eu
            cd ${{ env.REMOTE_DIR }}

            git rev-parse --git-dir >/dev/null 2>&1 || {
              echo "${{ env.REMOTE_DIR }} is not a git checkout — see DEPLOY.md"
              exit 1
            }

            # Hard reset rather than merge: the server holds no local commits,
            # and a deploy must land exactly what is on main. `.env` is
            # gitignored, so it survives this untouched.
            git fetch origin main
            git reset --hard origin/main
            echo "deploying $(git rev-parse --short HEAD)"

            # Fail loudly rather than booting a stack with empty passwords.
            test -f .env || { echo "missing ${{ env.REMOTE_DIR }}/.env — see DEPLOY.md"; exit 1; }

            # --pull refreshes the base images too, so a rebuild picks up
            # security updates to node:22-alpine and nginx rather than sitting
            # on whatever was cached the first time.
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml build --pull
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml up -d --remove-orphans

            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml ps

            # Only dangling layers — including the images this build just
            # superseded. Other projects on this machine keep their tagged
            # images, and building here makes this prune matter: without it the
            # disk fills with every previous build's layers.
            docker image prune -f

      # Without this a deploy that dies inside a container leaves the operator
      # with one line — "dependency failed to start: container ... is
      # unhealthy" — and no way to see what the container actually said. Only
      # api and postgres are dumped: they are what fails, and this log is
      # public, so the fewer services piped into it the better.
      - name: Container logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          # Best-effort: a missing service must not abort the rest of the dump.
          script_stop: false
          script: |
            cd ${{ env.REMOTE_DIR }} || exit 0

            echo "───────── container states ─────────"
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml ps -a || true

            for service in api postgres; do
              echo
              echo "───────── ${service} ─────────"
              docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml \
                logs --tail=80 --no-color "${service}" || true
            done

      # From the runner, over the public hostname: this proves the whole path
      # works — host nginx, TLS, the web container's /api proxy and the API's
      # database connection — not just that a container started.
      - name: Healthcheck through the public hostname
        run: |
          set -euo pipefail
          url="${{ env.SANDBOX_URL }}/api/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$url" 2>/dev/null) || body=""

            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              printf '%s\n' "$body"

              # A reachable API with an unreachable database is not a deploy
              # anyone should call successful.
              if ! printf '%s' "$body" | grep -q '"database":"up"'; then
                echo "::error::API is up but reports the database down"
                exit 1
              fi

              exit 0
            fi

            echo "attempt ${attempt}: not healthy yet"
            sleep 5
          done

          echo "::error::${url} did not report healthy after 30 attempts, 5s apart"
          echo "last response: ${body:-<no response>}"
          exit 1
