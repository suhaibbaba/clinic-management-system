name: Deploy sandbox

# Manual only. Build on the server -> healthcheck. No registry and no
# checkout: the VPS builds from its own clone of the repo. See DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      reset_data:
        # Typed, not a checkbox: a checkbox beside "Run workflow" is one
        # mis-click from deleting the database.
        description: "Wipe the sandbox database and object store before deploying. Type RESET to confirm — anything else is ignored."
        required: false
        default: ""
        type: string

# Never two at once, never cancelled: a half-applied migration is worse than a
# queued deploy.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  SANDBOX_URL: https://clinic-sandbox.organza-moda.com
  REMOTE_DIR: /opt/clinic/sandbox
  COMPOSE_PROJECT: clinic-sandbox

jobs:
  ci:
    name: CI
    # Skipped on a manual run: that is the path for redeploying or wiping while
    # main is red, which is when it is most needed.
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to sandbox VPS
    runs-on: ubuntu-latest
    needs: ci
    # `needs` alone would treat a skipped CI as a reason not to run, so the
    # result is read rather than assumed.
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')

    steps:
      # A typo must stop the job, not deploy without the reset that was asked for.
      - name: Check the reset confirmation
        env:
          RESET: ${{ inputs.reset_data }}
        run: |
          set -eu

          if [ -z "${RESET}" ] || [ "${RESET}" = "RESET" ]; then
            exit 0
          fi

          echo "::error::reset_data must be empty or exactly RESET — got \"${RESET}\""
          exit 1

      # Waits by signing in, not by knocking: a bare TCP probe drops the
      # connection without an identification string, which fail2ban bans the
      # runner for — so the old loop banned itself and then saw no answer.
      - name: Wait for the VPS to accept SSH
        env:
          SSH_HOST: ${{ secrets.SANDBOX_HOST }}
          SSH_PORT: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SANDBOX_USER }}
          SSH_KEY: ${{ secrets.SANDBOX_SSH_KEY }}
        run: |
          set -uo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/sandbox_probe
          chmod 600 ~/.ssh/sandbox_probe

          for attempt in $(seq 1 12); do
            if ssh -i ~/.ssh/sandbox_probe -p "$SSH_PORT" \
                 -o BatchMode=yes \
                 -o ConnectTimeout=10 \
                 -o StrictHostKeyChecking=accept-new \
                 -o LogLevel=ERROR \
                 "$SSH_USER@$SSH_HOST" true 2>/tmp/ssh-probe.err; then
              echo "signed in after ${attempt} attempt(s)"
              exit 0
            fi

            reason="$(tr -d '\r' < /tmp/ssh-probe.err | tail -1)"
            echo "attempt ${attempt}: ${reason:-no answer}"

            # Retrying cannot fix a refused key, and repeating one gets banned.
            case "$reason" in
              *"Permission denied"* | *"Too many authentication failures"* | *"no matching host key"*)
                echo "::error::the VPS answered and refused the deploy key — this is not a blip, check the key and the authorized_keys on the server"
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "::error::the sandbox VPS never accepted an SSH login on port ${SSH_PORT} — 12 attempts over about four minutes"
          exit 1

      # Manual only. The seed populates an empty clinic and leaves an adopted
      # one alone, so changing it cannot change the sandbox — only a wipe can.
      # Dumps first, and keeps the backups volume, which is why not `down -v`.
      - name: Wipe the sandbox data
        if: ${{ inputs.reset_data == 'RESET' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          script: |
            set -eu
            cd ${{ env.REMOTE_DIR }}

            compose() {
              docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml "$@"
            }

            # A wipe with no re-seed leaves a sandbox nobody can sign into.
            if ! grep -qE '^SEED_ON_BOOT=["'\''"]?true["'\''"]?[[:space:]]*$' .env; then
              echo "::error::SEED_ON_BOOT is not true in .env — a wipe would leave the sandbox empty"
              exit 1
            fi

            echo "==> Dump first, so a wipe is recoverable for as long as the backups are kept"
            compose run --rm backup once

            echo "==> Stopping the stack"
            compose down

            echo "==> Removing the data volumes (the backups volume is kept)"
            docker volume rm ${{ env.COMPOSE_PROJECT }}_clinic_pg_data || true
            docker volume rm ${{ env.COMPOSE_PROJECT }}_clinic_minio_data || true

            echo "==> Wiped. The deploy below recreates them and seeds from scratch."

      # On the server: it has the sources, and .env is made by hand, never by CI.
      - name: Build and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          script_stop: true
          # The dial, not the script: 30s expired on a box that was busy, not gone.
          timeout: 60s
          command_timeout: 30m
          script: |
            set -eu
            cd ${{ env.REMOTE_DIR }}

            git rev-parse --git-dir >/dev/null 2>&1 || {
              echo "${{ env.REMOTE_DIR }} is not a git checkout — see DEPLOY.md"
              exit 1
            }

            # Reset, not merge: the deploy lands exactly main. `.env` is gitignored.
            git fetch origin main
            git reset --hard origin/main
            echo "deploying $(git rev-parse --short HEAD)"

            echo "==> Making sure the full history is here (the version is a commit count)"
            if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
              echo "    shallow clone — unshallowing"
              git fetch --unshallow origin main || git fetch --depth=2147483647 origin main
            fi

            echo "==> Resolving app version"
            # Passed in: `.git` is outside the build context, so the images
            # cannot work it out. Mirrors scripts/app-version.mjs for a VPS
            # without node.
            if command -v node >/dev/null 2>&1; then
              APP_VERSION="$(node scripts/app-version.mjs)"
            else
              BASE="$(awk -F'"' '/"version"[[:space:]]*:/ { split($4, v, "."); print v[1] "." v[2]; exit }' package.json)"
              APP_VERSION="${BASE:-0.0}.$(git rev-list --count HEAD)"
            fi
            export APP_VERSION
            echo "    APP_VERSION=$APP_VERSION"

            # Fail loudly rather than booting a stack with empty passwords.
            test -f .env || { echo "missing ${{ env.REMOTE_DIR }}/.env — see DEPLOY.md"; exit 1; }

            # --pull so a rebuild picks up base image security updates.
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml build --pull
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml up -d --remove-orphans

            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml ps

            # Dangling only: the machine is shared, and building here fills the
            # disk with every previous build's layers.
            docker image prune -f

      # "container is unhealthy" alone says nothing about what the container
      # said. Two services only: this log is public.
      - name: Container logs on failure
        if: failure()
        # A dump that cannot reach the server must not bury the real failure.
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          timeout: 60s
          script_stop: false
          script: |
            cd ${{ env.REMOTE_DIR }} || exit 0

            echo "───────── container states ─────────"
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml ps -a || true

            for service in api postgres; do
              echo
              echo "───────── ${service} ─────────"
              docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker-compose.sandbox.yml \
                logs --tail=80 --no-color "${service}" || true
            done

      # Over the public hostname: proves nginx, TLS, the /api proxy and the
      # database, not just that a container started.
      - name: Healthcheck through the public hostname
        run: |
          set -euo pipefail
          url="${{ env.SANDBOX_URL }}/api/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$url" 2>/dev/null) || body=""

            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              printf '%s\n' "$body"

              # A reachable API over a dead database is not a successful deploy.
              if ! printf '%s' "$body" | grep -q '"database":"up"'; then
                echo "::error::API is up but reports the database down"
                exit 1
              fi

              exit 0
            fi

            echo "attempt ${attempt}: not healthy yet"
            sleep 5
          done

          echo "::error::${url} did not report healthy after 30 attempts, 5s apart"
          echo "last response: ${body:-<no response>}"
          exit 1
