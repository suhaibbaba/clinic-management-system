# Development stack: cp .env.example .env && docker compose up
#
# One bind mount of the repository root into a single dev image; node_modules
# live in named volumes so the mount never shadows them. packages/shared exists
# once — both apps consume it through the workspace symlink.

x-dev-image: &dev-image
  image: clinic-dev:local
  build:
    context: .
    dockerfile: docker/dev.Dockerfile

# The single bind mount of the whole workspace, plus named volumes layered on
# top of it so host directories never shadow container-installed dependencies.
x-dev-volumes: &dev-volumes
  - .:/repo
  - root-node-modules:/repo/node_modules
  - api-node-modules:/repo/apps/api/node_modules
  - web-node-modules:/repo/apps/web/node_modules
  - shared-node-modules:/repo/packages/shared/node_modules
  # Build output stays container-side too, so a container build never drops
  # root-owned dist/ directories into the developer's working tree.
  - api-dist:/repo/apps/api/dist
  - shared-dist:/repo/packages/shared/dist
  - pnpm-store:/pnpm/store
  - dev-state:/var/lib/clinic-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [clinic]

  # S3-compatible object storage for X-rays and documents. Production uses
  # Cloudflare R2; this is the same API locally, so nothing in the dev stack
  # needs real R2 credentials. `createbuckets` makes the bucket and exits.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-clinic_dev_access_key}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-clinic_dev_secret_key}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [clinic]

  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY_ID}" "$${STORAGE_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
    env_file: .env
    networks: [clinic]

  api:
    <<: *dev-image
    command: ["dev-api.sh"]
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes: *dev-volumes
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/api-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [clinic]

  web:
    <<: *dev-image
    command: ["dev-web.sh"]
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes: *dev-volumes
    depends_on:
      api:
        condition: service_started
    networks: [clinic]

volumes:
  postgres-data:
  minio-data:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  shared-node-modules:
  api-dist:
  shared-dist:
  pnpm-store:
  dev-state:

networks:
  clinic:
    driver: bridge
