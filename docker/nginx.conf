# TLS is terminated in front of this container, so `$scheme` here is always http; an `X-Forwarded-
# Proto` from that terminator wins. A forged one can only add `Secure` to the forger's own cookie.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The host nginx marks the clinic's own domain with `X-Clinic-Entry: site`; there every page that is
# not a file is the public website, and the dashboard lives on its `admin.` host.
map $http_x_clinic_entry $spa_entry {
    default /index.html;
    site    /site-entry;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arabic UI: make sure text is served as UTF-8.
    charset utf-8;

    server_tokens off;

    # nginx drops server-level add_header in any location that sets its own, so every such
    # location includes the same file.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API path — identical to the Vite dev proxy, so the web app
    # never needs an environment-specific base URL.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Emitted beside the worker rather than under /assets, but hashed the same way.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # An entry point names the hashed bundles, so a cached copy of it pins the whole old build.
    # Heuristic freshness alone kept browsers on the previous deploy for hours.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /booking.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The website's head is filled from the API through SSI, so a crawler and a chat preview read
    # the clinic's own title, description and picture.
    location = /site.html {
        ssi on;
        set $site_slug "";
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /site-entry {
        internal;
        ssi on;
        set $site_slug "";
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files /site.html =404;
    }

    # `/site/<slug>/…` on any host, and `/site/preview/…` framed by the dashboard's editor.
    location ~ ^/site/(?<site_slug>[a-z0-9-]+)(/[a-z0-9/-]*)?$ {
        ssi on;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/site-headers.conf;
        try_files /site.html =404;
    }

    # The worker is the update mechanism, so it cannot be cached: a stale one has no way to
    # announce its own replacement. Its precache entries are content-hashed under /assets.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Two paths reach the public booking bundle: `/book/…`, the short link, and `/booking/manage/…`
    # from the SMS — exact, because the app owns the rest of /booking/.
    location ~ ^/book(/|$)|^/booking/manage(/|$) {
        try_files $uri /booking.html;
    }

    location = / {
        rewrite ^ $spa_entry last;
    }

    # SPA fallback: every unknown path renders the app, or the website on the clinic's domain.
    location / {
        try_files $uri $uri/ $spa_entry;
    }
}
