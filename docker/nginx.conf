# The scheme the *browser* used, for whatever is in front of this container.
#
# This nginx listens on plain http: TLS is terminated by the host's proxy or by
# Cloudflare, so `$scheme` here is always "http" and would tell the API that
# every request was insecure. An `X-Forwarded-Proto` already on the request came
# from that terminator and is the honest answer, so it wins; `$scheme` is only
# the fallback for a stack with nothing in front of it.
#
# A client can of course write that header itself. It costs nothing: the value
# only ever *adds* `Secure` to the refresh cookie (see AUTH_COOKIE_SECURE — a
# production API marks it Secure regardless), so the worst a forged header can
# do is weaken the forger's own cookie.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arabic UI: make sure text is served as UTF-8.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API path — identical to the Vite dev proxy, so the web app
    # never needs an environment-specific base URL.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The public booking page is a second entry, not a route of the app: it
    # ships its own much smaller bundle. Two paths reach it — /book/… is the
    # short link a clinic hands out, /booking/manage/… is what the API writes
    # into the confirmation SMS. The second is deliberately exact: the app owns
    # the rest of /booking/, and a wider rule serves the public page to
    # reception.
    location ~ ^/book(/|$)|^/booking/manage(/|$) {
        try_files $uri /booking.html;
    }

    # SPA fallback: every unknown path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
