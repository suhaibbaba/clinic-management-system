# TLS is terminated in front of this container, so `$scheme` here is always http; an `X-Forwarded-
# Proto` from that terminator wins. A forged one can only add `Secure` to the forger's own cookie.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arabic UI: make sure text is served as UTF-8.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API path — identical to the Vite dev proxy, so the web app
    # never needs an environment-specific base URL.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Two paths reach the public booking bundle: `/book/…`, the short link, and `/booking/manage/…`
    # from the SMS — exact, because the app owns the rest of /booking/.
    location ~ ^/book(/|$)|^/booking/manage(/|$) {
        try_files $uri /booking.html;
    }

    # SPA fallback: every unknown path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
