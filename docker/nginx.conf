server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arabic UI: make sure text is served as UTF-8.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API path — identical to the Vite dev proxy, so the web app
    # never needs an environment-specific base URL.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
