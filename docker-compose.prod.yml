# Production stack: built images only, no bind mounts, no dev toolchain.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# The API applies pending Drizzle migrations before it starts listening.

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [clinic]

  api:
    image: clinic-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    # Migrations run to completion before the server starts listening, so a
    # deploy never serves traffic against an un-migrated database.
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/api-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [clinic]

  web:
    image: clinic-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [clinic]

volumes:
  postgres-data:

networks:
  clinic:
    driver: bridge
