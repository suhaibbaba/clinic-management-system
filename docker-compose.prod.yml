# Production stack: built images only, no bind mounts, no dev toolchain.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# The API applies pending Drizzle migrations before it starts listening.

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [clinic]

  api:
    image: clinic-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    # Migrations run to completion before the server starts listening, so a
    # deploy never serves traffic against an un-migrated database.
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/api-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [clinic]

  web:
    image: clinic-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_STORAGE_ORIGIN: ${VITE_STORAGE_ORIGIN:-}
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [clinic]

  # Nightly pg_dump, keeping the last 7 days. Set BACKUP_DIR to a host path so the dumps can be
  # copied off the machine; unset, they stay in the `backups` volume.
  # The script is inline rather than a mounted file so the backup schedule
  # travels with the stack definition and needs no extra image.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${BACKUP_DIR:-backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # `$0` is set to a label so an argument appended by `docker compose run`
    # lands in `$1` — that is how the on-demand `once` mode below is reached.
    entrypoint:
      - sh
      - -c
      - |
        set -eu

        dump() {
          stamp=$$(date -u +%Y%m%d-%H%M%S)
          file="/backups/clinic-$${stamp}.sql.gz"
          echo "[backup] dumping to $${file}"
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump \
            --host=postgres --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" \
            --no-owner --no-privileges | gzip -9 > "$${file}.part"
          mv "$${file}.part" "$${file}"
          echo "[backup] wrote $$(du -h "$${file}" | cut -f1)"

          # Retention: keep the last 7 days. Partial files from an interrupted
          # dump are swept with them.
          find /backups -name 'clinic-*.sql.gz*' -mtime +$${BACKUP_KEEP_DAYS:-7} \
            -exec rm -f {} + || true
        }

        # `once` runs a single dump and exits — that is the on-demand backup
        # documented in DEPLOY.md.
        if [ "$${1:-}" = "once" ]; then
          dump
          exit 0
        fi

        at="$${BACKUP_AT_UTC:-02:15}"
        hh=$${at%%:*}
        mm=$${at##*:}
        # Strip a leading zero: POSIX arithmetic reads "08" and "09" as invalid
        # octal, which would take the loop down every night at eight or nine.
        hh=$${hh#0}
        mm=$${mm#0}
        target=$$(( $${hh:-0} * 3600 + $${mm:-0} * 60 ))

        echo "[backup] nightly at $${at} UTC, keeping $${BACKUP_KEEP_DAYS:-7} days"

        while true; do
          # The epoch is UTC-aligned, so this is seconds since UTC midnight —
          # no date parsing, which busybox does not do reliably.
          now=$$(( $$(date -u +%s) % 86400 ))
          delay=$$(( target - now ))
          if [ "$$delay" -le 0 ]; then
            delay=$$(( delay + 86400 ))
          fi

          echo "[backup] next run in $${delay}s"
          sleep "$$delay"

          dump || echo "[backup] FAILED — will retry tomorrow"
        done
      - backup
    networks: [clinic]

volumes:
  postgres-data:
  backups:

networks:
  clinic:
    driver: bridge
